[package]
name = "scrabblebot-bot"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust greedy adaptive-depth beam-search Scrabble auction bot for Clockwork Labs' ScrabbleBot"
license = "MIT"
repository = "https://github.com/hutdtemp/scrabblebot"
readme = "README.md"

[lib]
name = "scrabblebot_bot"
path = "src/lib.rs"

[[bin]]
name = "scrabblebot-bot"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
spacetimedb-sdk = "=2.12.0"
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
